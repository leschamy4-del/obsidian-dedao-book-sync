name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify manifest version matches tag
        run: |
          node -e "const m=require('./manifest.json');const t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(m.version!==t){console.error('manifest.json version',m.version,'!= tag',t);process.exit(1)}"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build -- --prod

      - name: Attest build provenance (multi-line subject-path, per Obsidian review guidance)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Checksums
        run: |
          sha256sum main.js manifest.json styles.css > sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            sha256sums.txt